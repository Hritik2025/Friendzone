<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FriendZone Games</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#fff;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:22px}.card{background:#151c33;border:1px solid #293452;border-radius:22px;padding:22px;box-shadow:0 15px 50px #0005}
h1{font-size:38px;margin:0 0 8px}h2{margin-top:0}.muted{color:#aab4d0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
button,input{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px}button{background:#6d5dfc;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#26314f}button.danger{background:#c0395b}
input{background:#0e1528;color:#fff;border:1px solid #34415f}button:disabled{opacity:.45;cursor:not-allowed}.screen{display:none}.screen.active{display:block}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{background:#26314f;padding:8px 12px;border-radius:999px}
.players{display:flex;flex-wrap:wrap;gap:8px}.player{padding:10px 12px;background:#202a46;border-radius:12px}.host{outline:2px solid #6d5dfc}
.option{margin:8px 0;text-align:left}.timer{font-size:42px;font-weight:800;text-align:center}.score{font-size:20px;font-weight:800}.notice{padding:12px;border-radius:12px;background:#202a46;margin:12px 0}.hidden{display:none!important}
.small{font-size:13px}.code{font-size:34px;letter-spacing:8px;font-weight:900;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<section id="home" class="screen active card">
<h1>🎮 FriendZone</h1><p class="muted">Quick multiplayer games for your friend group.</p>
<div class="grid">
<div><h3>Create a room</h3><input id="createName" maxlength="18" placeholder="Your nickname"><br><br><button onclick="createRoom()">Create Room</button></div>
<div><h3>Join a room</h3><input id="joinName" maxlength="18" placeholder="Your nickname"><br><br><input id="roomInput" maxlength="6" placeholder="ROOM CODE" style="text-transform:uppercase"><br><br><button onclick="joinRoom()">Join Room</button></div>
</div><p id="homeMsg" class="muted"></p>
</section>

<section id="lobby" class="screen card">
<div class="top"><div><h2>🎮 Lobby</h2><div class="muted">Room code</div><div id="roomCode" class="code"></div></div><button class="secondary" onclick="copyCode()">Copy code</button></div>
<hr>
<h3>Players</h3><div id="players" class="players"></div>
<div id="hostControls" class="hidden"><h3>Choose a game</h3><div class="grid">
<button onclick="startGame('quiz')">🧠 Quiz Battle</button>
<button onclick="startGame('most')">😂 Most Likely To</button>
<button onclick="startGame('wyr')">🤔 Would You Rather</button>
<button onclick="startGame('fast')">⚡ Fastest Finger</button>
</div></div>
<div id="waiting" class="notice">Waiting for the host to start a game…</div>
</section>

<section id="game" class="screen card">
<div class="top"><div class="pill" id="gameTitle"></div><div class="pill">Score: <span id="myScore">0</span></div></div>
<div id="gameBody"></div>
</section>

<section id="result" class="screen card">
<h2>🏆 Round complete!</h2><div id="resultBody"></div><button onclick="backLobby()">Back to Lobby</button>
</section>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getDatabase,ref,set,update,onValue,get} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

/* 1) Replace this object with your Firebase Web App config. */
const firebaseConfig={
  apiKey:"PASTE_API_KEY",
  authDomain:"PASTE_PROJECT.firebaseapp.com",
  databaseURL:"PASTE_DATABASE_URL",
  projectId:"PASTE_PROJECT_ID",
  storageBucket:"PASTE_PROJECT.firebasestorage.app",
  messagingSenderId:"PASTE_SENDER_ID",
  appId:"PASTE_APP_ID"
};

const app=initializeApp(firebaseConfig), db=getDatabase(app), auth=getAuth(app);
let uid=null,room=null,myName="",isHost=false,roomData=null,unsubscribe=null,answered=false;

const games={
quiz:[
 {q:"Which planet is known as the Red Planet?",a:["Earth","Mars","Jupiter","Venus"],c:1},
 {q:"How many sides does a hexagon have?",a:["5","6","7","8"],c:1},
 {q:"Which ocean is the largest?",a:["Atlantic","Indian","Pacific","Arctic"],c:2}
],
most:[
 "Who is most likely to become famous?",
 "Who is most likely to reply after 3 business days?",
 "Who is most likely to survive a zombie apocalypse?",
 "Who is most likely to become a billionaire?"
],
wyr:[
 {q:"Would you rather always be 10 minutes late or 20 minutes early?",a:"Always 10 minutes late",b:"Always 20 minutes early"},
 {q:"Would you rather have unlimited money or unlimited free time?",a:"Unlimited money",b:"Unlimited free time"},
 {q:"Would you rather read minds or see the future?",a:"Read minds",b:"See the future"}
]};

function $(id){return document.getElementById(id)}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function msg(t){$("homeMsg").textContent=t}
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function clean(s){return String(s||"").trim().slice(0,18)}

signInAnonymously(auth).catch(e=>msg("Firebase Auth error: "+e.message));
onAuthStateChanged(auth,u=>{uid=u?.uid||null});

async function createRoom(){
 const n=clean($("createName").value); if(!n)return msg("Enter your nickname.");
 if(!uid)return msg("Connecting… try again in a moment.");
 room=makeCode();myName=n;isHost=true;
 await set(ref(db,"rooms/"+room),{host:uid,game:null,round:0,status:"lobby",players:{[uid]:{name:n,score:0}}});
 listen();show("lobby");
}
async function joinRoom(){
 const n=clean($("joinName").value), code=$("roomInput").value.trim().toUpperCase();
 if(!n||code.length!==6)return msg("Enter nickname and a 6-character room code.");
 const snap=await get(ref(db,"rooms/"+code));
 if(!snap.exists())return msg("Room not found.");
 room=code;myName=n;isHost=false;
 await update(ref(db,"rooms/"+room+"/players/"+uid),{name:n,score:0});
 listen();show("lobby");
}
function listen(){
 if(unsubscribe)unsubscribe();
 unsubscribe=onValue(ref(db,"rooms/"+room),snap=>{
  roomData=snap.val(); if(!roomData)return;
  isHost=roomData.host===uid;
  $("roomCode").textContent=room;
  renderPlayers();
  if(roomData.status==="lobby")show("lobby");
  else if(roomData.status==="game")renderGame();
  else if(roomData.status==="result")renderResult();
 });
}
function renderPlayers(){
 const ps=roomData.players||{}; $("players").innerHTML=Object.entries(ps).map(([id,p])=>
 `<span class="player ${id===roomData.host?"host":""}">${esc(p.name)}${id===roomData.host?" 👑":""} <b>${p.score||0}</b></span>`).join("");
 $("hostControls").classList.toggle("hidden",!isHost);
 $("waiting").classList.toggle("hidden",isHost);
 $("myScore").textContent=ps[uid]?.score||0;
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

async function startGame(type){
 if(!isHost)return;
 const round=(roomData.round||0)+1;
 await update(ref(db,"rooms/"+room),{game:type,round,status:"game",answers:{},startedAt:Date.now()});
}
function renderGame(){
 const type=roomData.game; $("gameTitle").textContent={quiz:"🧠 Quiz Battle",most:"😂 Most Likely To",wyr:"🤔 Would You Rather",fast:"⚡ Fastest Finger"}[type];
 if(type==="quiz")renderQuiz(); else if(type==="most")renderMost(); else if(type==="wyr")renderWyr(); else renderFast();
}
function renderQuiz(){
 const q=games.quiz[(roomData.round-1)%games.quiz.length]; const mine=(roomData.answers||{})[uid];
 $("gameBody").innerHTML=`<h2>${q.q}</h2>${q.a.map((x,i)=>`<button class="option" ${mine!=null?"disabled":""} onclick="answer(${i})">${x}</button>`).join("")}<div class="notice">Answer once. The host can end the round.</div>`;
}
window.answer=async function(i){
 if((roomData.answers||{})[uid]!=null)return;
 const q=games.quiz[(roomData.round-1)%games.quiz.length];
 await update(ref(db,`rooms/${room}/answers`),{[uid]:i});
 if(i===q.c)await update(ref(db,`rooms/${room}/players/${uid}`),{score:(roomData.players[uid].score||0)+1});
}
function renderMost(){
 const q=games.most[(roomData.round-1)%games.most.length], mine=(roomData.answers||{})[uid];
 const ps=roomData.players||{};
 $("gameBody").innerHTML=`<h2>${q}</h2><p class="muted">Pick a friend.</p>${Object.entries(ps).map(([id,p])=>`<button class="option" ${mine?"disabled":""} onclick="vote('${id}')">${esc(p.name)}</button>`).join("")}<div class="notice">Everyone votes. No self-voting.</div>`;
}
window.vote=async id=>{
 if(id===uid||(roomData.answers||{})[uid])return;
 await update(ref(db,`rooms/${room}/answers`),{[uid]:id});
}
function renderWyr(){
 const q=games.wyr[(roomData.round-1)%games.wyr.length], mine=(roomData.answers||{})[uid];
 $("gameBody").innerHTML=`<h2>${q.q}</h2><button class="option" ${mine?"disabled":""} onclick="vote('${btoa(q.a)}')">${q.a}</button><button class="option" ${mine?"disabled":""} onclick="vote('${btoa(q.b)}')">${q.b}</button>`;
}
function renderFast(){
 $("gameBody").innerHTML=`<h2>Tap when you see GO!</h2><div class="timer" id="fastText">WAIT…</div><button onclick="fastTap()" id="fastBtn" disabled>WAIT</button>`;
 if(isHost)setTimeout(async()=>{await update(ref(db,`rooms/${room}`),{fastGoAt:Date.now()+2500})},800);
 setTimeout(()=>{if(roomData.fastGoAt){$("fastText").textContent="GO!";$("fastBtn").disabled=false}},2500);
}
window.fastTap=async()=>{if((roomData.answers||{})[uid])return;await update(ref(db,`rooms/${room}/answers`),{[uid]:Date.now()})}

window.backLobby=async()=>{if(isHost)await update(ref(db,`rooms/${room}`),{status:"lobby",game:null,answers:null,fastGoAt:null});else show("lobby")};
function renderResult(){
 const ps=Object.values(roomData.players||{}).sort((a,b)=>(b.score||0)-(a.score||0));
 $("resultBody").innerHTML=ps.map((p,i)=>`<div class="notice">${i+1}. <b>${esc(p.name)}</b> — ${p.score||0} pts</div>`).join("");
}
window.copyCode=()=>navigator.clipboard?.writeText(room).then(()=>alert("Room code copied!"));
</script>
</body>
</html>
